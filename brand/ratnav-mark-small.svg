<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" role="img" aria-label="RatNav">
  <title>RatNav</title>

  <!--
    The small mark: the full one with the tail dropped.

    Below about 32 pixels the tail is a smudge that costs the arrow its point, so it goes. Use this
    for favicons, tray icons, and anywhere else the mark is rendered smaller than a fingertip.
  -->

  <!-- Ears. Half on the flank, half off it — breaking the outline is what makes it an animal. -->
  <circle cx="72" cy="110" r="28" fill="currentColor" />
  <circle cx="184" cy="110" r="28" fill="currentColor" />

  <!-- The arrow, and the head. The notch is what keeps it reading as a heading rather than a triangle. -->
  <path d="M 128,18 L 198,186 L 128,150 L 58,186 Z" fill="currentColor" />
</svg>
