# Closes pull requests from the public.
#
# RatNav takes contributions from invited collaborators and from nobody else. Without this a
# stranger writes a patch, waits, and hears nothing — which is a worse answer than being told no
# straight away.
#
# Forking stays allowed on purpose: the license invites it, and the README says so out loud. The
# way in for anybody else is a fork with its own name, not a patch to this one.
name: No public pull requests

# pull_request_target, not pull_request: a fork's own GITHUB_TOKEN is read-only, so a workflow
# triggered by pull_request cannot comment or close. This never checks out the PR's code, which is
# the thing that makes pull_request_target dangerous.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    # author_association is GitHub's own answer to "who is this to the repository": OWNER for the
    # owner, COLLABORATOR for anybody invited. Everything else — CONTRIBUTOR, FIRST_TIME_CONTRIBUTOR,
    # NONE — is a stranger, and is what this exists for.
    #
    # Checked rather than a hardcoded list of names, so adding a collaborator is one click and not
    # a commit here that somebody will forget.
    if: >-
      github.event.pull_request.author_association != 'OWNER' &&
      github.event.pull_request.author_association != 'COLLABORATOR'
    runs-on: ubuntu-latest
    steps:
      - name: Say why, then close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr comment "$PR" --body "Thanks for taking the time to write this.

          **RatNav only takes pull requests from invited collaborators**, so this is closed automatically. It is not a judgment on the change — there is no open review queue here, and leaving a patch sitting for months would be a worse answer than saying no now.

          - **Found a bug?** An [issue](https://github.com/mrthames/RatNav/issues) is the way, and those are read.
          - **Want RatNav to do something it does not?** The [license](https://github.com/mrthames/RatNav/blob/main/LICENSE) lets you fork it for anything noncommercial. Give your version its own name and it is yours.

          See [CONTRIBUTING.md](https://github.com/mrthames/RatNav/blob/main/CONTRIBUTING.md)."

          gh pr close "$PR"
