name: Latest stable

# Checks that the README's install line names the release people actually get.
#
# It used to fix it: commit the new version and push. That cannot work any more, and the reason is
# worth writing down. `main` is protected, and a workflow pushing to it needs bypass — which on a
# personal repository GitHub will not grant, because the Actions integration "must be part of the
# ruleset source or owner organization". So the push is refused, and a workflow that silently
# cannot do its job is worse than no workflow.
#
# The README line is updated by hand now, in the same pull request that closes a version in the
# CHANGELOG. That is one step in one place, reviewed like anything else — and this exists to say so
# out loud if it was forgotten, because a stale install line sends somebody looking for a file that
# is not there.
#
# It only reads. Nothing here needs write access, which is the point.

on:
  release:
    types: [released, edited]

  schedule:
    # Weekly, so a line that goes stale between releases is still noticed.
    - cron: '0 9 * * 1'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Does the README name the latest release?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(gh release view --json tagName --jq .tagName)
          version=${latest#v}

          line=$(grep -m1 'latest-stable' README.md || true)
          echo "latest release: $latest"
          echo "README says:    $line"

          if echo "$line" | grep -q "$latest" && echo "$line" | grep -q "RatNav-$version-setup.exe"; then
            echo "The README names $latest."
            exit 0
          fi

          echo "::error::README's install line does not name $latest."
          echo "::error::Update the 'latest-stable' line in README.md to $latest and RatNav-$version-setup.exe."
          exit 1
