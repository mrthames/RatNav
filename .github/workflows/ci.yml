name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # First, and on every push. This is a public repository for a tool other people download, and
      # what belongs in it is what somebody needs to understand, build and install RatNav — nothing
      # about the machine it happens to be developed on. A rule nobody checks is a rule that holds
      # until the first time somebody is in a hurry.
      - name: Nothing personal in the repository
        shell: bash
        run: tools/check-for-personal-data.sh

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The web app builds into the service's wwwroot, so it goes first.
      - name: Build the web app
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      # The installer script is only compiled by the release workflow, which runs on a tag — so a
      # broken one is found by cutting a release and watching it fail. It has happened. Compiling
      # it here costs a couple of minutes and moves that discovery to the commit that caused it.
      #
      # Only on main: it needs a full self-contained publish, which is too slow to ask of every
      # pull request.
      - name: Check the installer script still compiles
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          dotnet publish src/RatNav.App --configuration Release --runtime win-x64 `
            --self-contained true --output publish

          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/RatNav.iss /DAppVersion=0.0.0
