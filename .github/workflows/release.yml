name: Release

on:
  push:
    tags: ['v*']

  # So a release build can be proven without cutting a tag first.
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the web app
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Test before shipping
        run: dotnet test --configuration Release

      # Self-contained, so there is no runtime to install first — someone downloading a Tarkov
      # tool should not have to read about .NET before they can use it.
      #
      # Not single-file: WPF crashes on startup when packed that way, and the installer makes the
      # file layout invisible regardless. The zip is here for people who would rather not install
      # anything at all.
      - name: Publish
        run: >
          dotnet publish src/RatNav.App
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish

      - name: Check the web app shipped
        shell: pwsh
        run: |
          if (-not (Test-Path publish/wwwroot/index.html)) {
            throw "wwwroot is missing from the publish output — every page would 404."
          }

      # A tag with a suffix — v0.3.0-alpha.1 — is a prerelease. GitHub keeps prereleases out of
      # "Latest", so the download button on the repository goes on pointing at the last stable
      # build until one is deliberately promoted.
      - name: Version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = if ($tag -match '^v(\d+\.\d+\.\d+)') { $Matches[1] } else { "0.0.0" }
          $prerelease = if ($tag -match '^v\d+\.\d+\.\d+-') { "true" } else { "false" }

          "version=$version" >> $env:GITHUB_OUTPUT
          "name=$tag" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc installer/RatNav.iss "/DAppVersion=${{ steps.version.outputs.version }}"

      - name: Package the portable build
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath "RatNav-${{ steps.version.outputs.name }}-win-x64.zip"

      # A release published here is created with GITHUB_TOKEN, and GitHub does not raise workflow
      # events for those — so "Latest stable" will not fire on its own and the README will go on
      # naming the previous version. Said in the job summary rather than left to be rediscovered.
      - name: Remind about the README
        if: steps.version.outputs.prerelease != 'true'
        shell: bash
        run: |
          echo "### One more step" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Run the **Latest stable** workflow to update the README's install line." >> "$GITHUB_STEP_SUMMARY"
          echo "It cannot trigger itself: releases published with GITHUB_TOKEN raise no events." >> "$GITHUB_STEP_SUMMARY"

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: |
            installer-output/RatNav-${{ steps.version.outputs.version }}-setup.exe
            RatNav-${{ steps.version.outputs.name }}-win-x64.zip
          generate_release_notes: true
          body: |
            ${{ steps.version.outputs.prerelease == 'true' && '> **This is an alpha.** It is not the latest stable release, and the download on the repository front page still points at that one. Try it if you want what is new; wait if you would rather it settled first.' || '' }}
            **Install:** download `RatNav-${{ steps.version.outputs.version }}-setup.exe` and run it.
            It installs for your user only — no administrator prompt — and puts RatNav in your
            Start Menu. Nothing else needs installing; the .NET runtime is included.

            **Portable:** `RatNav-${{ steps.version.outputs.name }}-win-x64.zip`, if you would
            rather unzip it and run `RatNav.exe` yourself.

            RatNav reads Escape from Tarkov's log files and the coordinates the game writes into
            screenshot filenames. It does not read the game's memory, inject code, hook rendering,
            modify game files, or send input to the game.
