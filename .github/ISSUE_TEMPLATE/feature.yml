name: An idea
description: Something RatNav could do that it does not
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >-
        One thing first: RatNav reads only what the game already writes to disk. Anything needing
        game memory, code injection, rendering hooks, or synthetic input into the game is out of
        scope permanently, however useful — the whole value of this rests on being safe to run.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >-
        The situation rather than the solution. "I keep vendoring things I need next week" tells us
        more than "add a column", and often has a better answer than the one you had in mind.
    validations: { required: true }

  - type: textarea
    id: idea
    attributes:
      label: What you had in mind
      description: If you have a shape for it. Skip this if you do not — the problem is the useful half.

  - type: textarea
    id: today
    attributes:
      label: How you handle it today
      description: A spreadsheet, another tool, memory, or not at all.
