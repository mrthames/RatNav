name: A map is wrong
description: Pins land in the wrong place, or a map is marked uncertain
labels: [map data]
body:
  - type: input
    id: map
    attributes:
      label: Which map
    validations: { required: true }

  - type: input
    id: filename
    attributes:
      label: A screenshot filename from that map
      description: |
        The whole filename, which carries your coordinates. Take it somewhere you can point at
        on the map — an extract is ideal, and near the edge is better than the middle.
    validations: { required: true }

  - type: input
    id: where
    attributes:
      label: Where you actually were
      description: |
        Run `tools/make-calibration-page.py`, click your spot, and paste the "best fit" line.
        Or describe the place and someone will do it.
